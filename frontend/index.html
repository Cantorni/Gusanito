<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gusanito – Zambia</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1b1d19" />
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/protomaps-leaflet.js"></script>
  <script src="config.js"></script>
  <style>
    /* Daylight-first: the landscape is dry (ash, straw), so the one living colour is the green of a reservoir. */
    @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-display: swap; src: url(vendor/fonts/atkinson-400.woff2) format("woff2"); }
    @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-display: swap; src: url(vendor/fonts/atkinson-700.woff2) format("woff2"); }

    :root {
      --ash: #e6e4dd;        /* page / sheet */
      --paper: #f4f3ee;      /* inputs */
      --coal: #1b1d19;       /* text, top bar */
      --straw: #a89a6a;      /* secondary, dry grass */
      --rule: #c2bfb2;       /* borders */
      --reservoir: #17893f;  /* the one vivid colour: living vegetation */
      --reservoir-ink: #0e5a29;
      --ember: #c93a14;      /* problems only */
      --muted: #5b5d52;
      --radius: 10px;
      --tap: 52px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body { font-family: "Atkinson Hyperlegible", system-ui, sans-serif; background: var(--ash); color: var(--coal); font-size: 1rem; line-height: 1.4; overflow: hidden; }
    button, input, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--coal); outline-offset: 2px; }

    #map { position: absolute; inset: 0; background: var(--ash); }
    .leaflet-top { top: 56px; }
    .leaflet-container { font-family: inherit; }

    /* top bar */
    #topbar { position: absolute; z-index: 1100; top: 0; left: 0; right: 0; height: 52px; padding: 0 16px; background: var(--coal); color: var(--paper); display: flex; align-items: center; justify-content: space-between; }
    #topbar h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .01em; }
    #net { font-size: .85rem; padding: 4px 10px; border-radius: 99px; border: 1.5px solid var(--straw); color: var(--paper); }
    body.is-offline #net { background: var(--straw); color: var(--coal); border-color: var(--straw); font-weight: 700; }

    /* bottom sheet */
    #sheet { position: absolute; z-index: 1100; left: 0; right: 0; bottom: 0; background: var(--ash); border-top: 2px solid var(--coal); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
    #info-bar { font-size: 1rem; margin-bottom: 12px; min-height: 1.4em; }
    #info-bar .hi { font-weight: 700; color: var(--reservoir-ink); font-variant-numeric: tabular-nums; }
    #target { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; padding: 8px 8px 8px 12px; border: 2px solid var(--reservoir-ink); border-radius: var(--radius); background: var(--paper); }
    #target strong { color: var(--reservoir-ink); }
    #target .btn { min-height: 44px; padding: 0 12px; border-color: transparent; font-weight: 400; text-decoration: underline; }

    .btn { min-height: var(--tap); border-radius: var(--radius); border: 2px solid var(--coal); background: transparent; font-weight: 700; padding: 0 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--reservoir); border-color: var(--reservoir-ink); color: #fff; }
    .btn:disabled { opacity: .55; cursor: default; }
    .actions { display: grid; gap: 8px; }
    #btn-photo { min-height: 64px; font-size: 1.15rem; }

    #cache-bar { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); margin-top: 10px; }
    #cache-progress { flex: 1; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
    #cache-fill { height: 100%; width: 0; background: var(--reservoir); transition: width .3s; }

    /* map marks */

    /* photo pop-up: opens after the photo is taken */
    #ask { border: 2px solid var(--coal); border-radius: 14px; background: var(--ash); color: var(--coal); padding: 0; width: min(92vw, 400px); margin: auto; overflow: hidden; }
    #ask::backdrop { background: rgba(27, 29, 25, .72); }
    #ask .body { padding: 16px; }
    #ask img { display: block; width: 100%; height: 190px; object-fit: cover; border-radius: var(--radius); border: 1.5px solid var(--rule); background: var(--paper); margin-bottom: 14px; }
    #ask h2 { font-size: 1.3rem; margin-bottom: 12px; }
    #ask .btn { width: 100%; min-height: 60px; font-size: 1.1rem; margin-bottom: 10px; }
    #ask .choices { display: grid; gap: 8px; margin-bottom: 8px; }
    #ask .choice { min-height: 56px; margin: 0; justify-content: flex-start; gap: 12px; font-weight: 400; }
    #ask .choice::before { content: ""; flex: none; width: 22px; height: 22px; border: 2px solid var(--coal); border-radius: 50%; background: var(--paper); }
    #ask .choice[aria-checked="true"] { background: var(--coal); color: var(--paper); font-weight: 700; }
    #ask .choice[aria-checked="true"]::before { border-color: var(--paper); background: var(--reservoir); box-shadow: inset 0 0 0 4px var(--coal); }
    #ask .link { min-height: 48px; border-color: transparent; font-weight: 400; text-decoration: underline; }
    #ask-msg { min-height: 1.4em; margin-bottom: 8px; font-size: 1rem; }
    #ask-msg.err { color: var(--ember); font-weight: 700; }
    #ask .done h2 { color: var(--reservoir-ink); }
    #ask .done p { color: var(--muted); margin-bottom: 16px; }

    @media (prefers-reduced-motion: reduce) { #cache-fill { transition: none; } }
    @media (max-width: 380px) { .fields { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <h1>Gusanito</h1>
  <span id="net" role="status">En línea</span>
</div>

<section id="sheet" aria-label="Controles">
  <p id="info-bar" aria-live="polite">Buscando tu ubicación…</p>
  <div id="target" role="status" hidden>
    <span id="target-text"></span>
    <button id="target-clear" class="btn" type="button">Quitar</button>
  </div>
  <div class="actions">
    <button id="btn-photo" class="btn primary" type="button">Tomar foto del parche</button>
    <button id="btn-locate" class="btn" type="button" hidden>Activar ubicación</button>
  </div>
  <div id="cache-bar">
    <span id="cache-label">Descargando mapa sin conexión…</span>
    <div id="cache-progress"><div id="cache-fill"></div></div>
  </div>
</section>

<input id="photo-file" type="file" accept="image/*" capture="environment" hidden />

<dialog id="ask" aria-labelledby="ask-title">
  <div class="body" id="ask-question">
    <img id="photo-preview" alt="Foto tomada" />
    <h2 id="ask-title">¿Qué ves en la foto?</h2>
    <div class="choices" role="radiogroup" aria-labelledby="ask-title">
      <button class="btn choice" type="button" role="radio" aria-checked="false" data-label="armyworm">Hay plaga</button>
      <button class="btn choice" type="button" role="radio" aria-checked="false" data-label="not_armyworm">No hay plaga</button>
      <button class="btn choice" type="button" role="radio" aria-checked="false" data-label="unsure">No estoy seguro</button>
    </div>
    <div id="ask-msg" role="alert"></div>
    <button id="ask-send" class="btn primary" type="button" disabled>Enviar foto</button>
    <button id="ask-cancel" class="btn link" type="button">Cancelar</button>
  </div>
  <div class="body done" id="ask-done" hidden>
    <h2>Foto enviada</h2>
    <p id="ask-done-text">Un agrónomo la revisará.</p>
    <button id="ask-another" class="btn" type="button">Tomar otra foto</button>
    <button id="ask-close" class="btn" type="button">Listo</button>
  </div>
</dialog>

<script>
// ---- ONLINE CHIP ----
const net = document.getElementById('net');
const updateOnline = () => {
  document.body.classList.toggle('is-offline', !navigator.onLine);
  net.textContent = navigator.onLine ? 'En línea' : 'Sin conexión';
};
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);
updateOnline();

// ---- STATE ----
let userPos = null, userMarker = null, accuracyCircle = null, centered = false, watchId = null;

// ---- MAP: Leaflet + offline vector tiles (zambia.pmtiles, cached by the service worker) ----
const map = L.map('map', { zoomControl: false }).setView([-13.5, 28.0], 5);
L.control.zoom({ position: 'topright', zoomInTitle: 'Acercar', zoomOutTitle: 'Alejar' }).addTo(map);
map.attributionControl.setPosition('topleft');
// maxDataZoom 12: tiles are overzoomed beyond that (shortcut: extract is z0-12, regenerate for more detail)
protomapsL.leafletLayer({ url: '/zambia.pmtiles', flavor: 'grayscale', lang: 'es', maxDataZoom: 12 }).addTo(map);
const overlay = L.layerGroup().addTo(map);

// ---- RESERVOIRS: probable dry-season reservoirs from the satellite model ----
// Tapping one makes the next photo a report about that patch.
const API = window.GUSANITO.apiBase;
const RESERVOIR_MIN_ZOOM = 9;
const RESERVOIR_STYLE = { color: '#0e5a29', weight: 2, fillColor: '#17893f', fillOpacity: 0.3 };
const SELECTED_STYLE = { color: '#1b1d19', weight: 4, fillColor: '#17893f', fillOpacity: 0.55 };
let selected = null; // { id, layer }
let reservoirRequest = null, reservoirTimer = null;

map.createPane('reservoirs').style.zIndex = 350; // under the overlay pane, so the user's dot stays on top

const reservoirLayer = L.geoJSON(null, {
  pane: 'reservoirs',
  bubblingMouseEvents: false, // a tap on a patch must not reach the map (which clears the selection)
  style: () => RESERVOIR_STYLE,
  pointToLayer: (f, latlng) => L.circleMarker(latlng, { ...RESERVOIR_STYLE, radius: 12, pane: 'reservoirs', bubblingMouseEvents: false }),
  onEachFeature: (f, layer) => layer.on('click', () => selectReservoir(f, layer)),
}).addTo(map);

function selectReservoir(feature, layer) {
  if (selected) selected.layer.setStyle(RESERVOIR_STYLE);
  selected = { id: String(feature.id), layer };
  layer.setStyle(SELECTED_STYLE);
  const p = feature.properties || {};
  const prob = Number.isFinite(p.probabilidad) ? ` · probabilidad ${Math.round(p.probabilidad * 100)}%` : '';
  document.getElementById('target-text').innerHTML = `Parche <strong>${escapeHtml(selected.id)}</strong>${prob}`;
  document.getElementById('target').hidden = false;
  document.getElementById('btn-photo').textContent = 'Tomar foto de este parche';
}

function clearReservoir() {
  if (selected) selected.layer.setStyle(RESERVOIR_STYLE);
  selected = null;
  document.getElementById('target').hidden = true;
  document.getElementById('btn-photo').textContent = 'Tomar foto del parche';
}
document.getElementById('target-clear').addEventListener('click', clearReservoir);
map.on('click', clearReservoir);

async function loadReservoirs() {
  if (!navigator.onLine || map.getZoom() < RESERVOIR_MIN_ZOOM) return; // offline: keep what is drawn
  const b = map.getBounds();
  const clamp = (v, lim) => Math.max(-lim, Math.min(lim, v));
  const bbox = [clamp(b.getWest(), 180), clamp(b.getSouth(), 90), clamp(b.getEast(), 180), clamp(b.getNorth(), 90)].map(v => v.toFixed(5)).join(',');
  if (reservoirRequest) reservoirRequest.abort();
  reservoirRequest = new AbortController();
  try {
    const r = await fetch(`${API}/reservoirs?bbox=${bbox}`, { signal: reservoirRequest.signal });
    if (!r.ok) return; // 404: the satellite pipeline has not published a layer yet
    const layer = await r.json();
    const keep = selected && layer.features.find(f => String(f.id) === selected.id);
    reservoirLayer.clearLayers();
    reservoirLayer.addData(layer);
    if (keep) reservoirLayer.eachLayer(l => { if (String(l.feature.id) === selected.id) selectReservoir(l.feature, l); });
    else if (selected) clearReservoir();
  } catch (_) { /* aborted or network error: keep the current layer */ }
}
map.on('moveend', () => { clearTimeout(reservoirTimer); reservoirTimer = setTimeout(loadReservoirs, 400); });
window.addEventListener('online', loadReservoirs);

// ---- LOCATION: automatic, the user never types coordinates ----
const locateBtn = document.getElementById('btn-locate');

function onFix(pos) {
  const { latitude: lat, longitude: lng, accuracy } = pos.coords;
  userPos = { lat, lng, accuracy };
  if (!userMarker) {
    accuracyCircle = L.circle([lat, lng], { radius: accuracy, color: '#0e5a29', weight: 1.5, fillColor: '#17893f', fillOpacity: 0.15, interactive: false }).addTo(overlay);
    userMarker = L.circleMarker([lat, lng], { radius: 9, color: '#fff', weight: 3, fillColor: '#1b1d19', fillOpacity: 1, interactive: false }).addTo(overlay);
  } else {
    userMarker.setLatLng([lat, lng]);
    accuracyCircle.setLatLng([lat, lng]).setRadius(accuracy);
  }
  if (!centered) { map.setView([lat, lng], 15); centered = true; }
  setInfo(`Tu ubicación: <span class="hi">${lat.toFixed(5)}, ${lng.toFixed(5)}</span> (±${Math.round(accuracy)} m)`);
  locateBtn.hidden = true;
}

function onGeoError(err) {
  setInfo(err.code === 1
    ? 'La ubicación está desactivada. Actívala para ubicar tus fotos.'
    : 'No se pudo obtener tu ubicación. Revisa que el GPS esté encendido.');
  locateBtn.hidden = false;
}

function startLocating() {
  if (!navigator.geolocation) { setInfo('Este dispositivo no tiene GPS.'); return; }
  setInfo('Buscando tu ubicación…');
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onFix, onGeoError, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
locateBtn.addEventListener('click', startLocating);
startLocating();

// ---- PHOTO REPORT ----
// Flow: take photo -> pop-up asks what they see -> pick an answer -> "Enviar foto" confirms. The PWA
// only sends the photo; the server asks Claude and keeps the analysis, so nothing from Claude is shown here.
const fileIn = document.getElementById('photo-file');
const ask = document.getElementById('ask');
const askMsg = document.getElementById('ask-msg');
const choiceBtns = document.querySelectorAll('#ask [data-label]');
const sendBtn = document.getElementById('ask-send');
let label = null;

function choose(btn) {
  label = btn ? btn.dataset.label : null;
  choiceBtns.forEach(b => b.setAttribute('aria-checked', String(b === btn)));
  sendBtn.disabled = !label;
}
choiceBtns.forEach(btn => btn.addEventListener('click', () => choose(btn)));
function setSending(sending) {
  choiceBtns.forEach(b => (b.disabled = sending));
  sendBtn.disabled = sending || !label;
  sendBtn.textContent = sending ? 'Enviando foto…' : 'Enviar foto';
}

function fail(msg) { askMsg.className = 'err'; askMsg.textContent = msg; }
function showAsk(question) {
  document.getElementById('ask-question').hidden = !question;
  document.getElementById('ask-done').hidden = question;
}
function closeAsk() { ask.close(); fileIn.value = ''; }

document.getElementById('btn-photo').addEventListener('click', () => fileIn.click());
document.getElementById('ask-another').addEventListener('click', () => { closeAsk(); fileIn.click(); });
document.getElementById('ask-close').addEventListener('click', closeAsk);
document.getElementById('ask-cancel').addEventListener('click', closeAsk);
ask.addEventListener('cancel', () => { fileIn.value = ''; }); // Esc / back button

// One id per photo: a retry after a dropped connection resends the same report, never a duplicate.
let reportId = null;

fileIn.addEventListener('change', () => {
  const f = fileIn.files[0];
  if (!f) return;
  reportId = crypto.randomUUID();
  document.getElementById('photo-preview').src = URL.createObjectURL(f);
  askMsg.className = ''; askMsg.textContent = '';
  choose(null);
  setSending(false);
  showAsk(true);
  ask.showModal();
});

// Downscale to <=1280px JPEG: smaller upload on weak networks (also drops EXIF).
async function toJpeg(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const data = c.toDataURL('image/jpeg', 0.82).split(',')[1]; // plain base64, no data: prefix
  return { data, width: bmp.width, height: bmp.height };
}

function getGps() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 10000 });
  });
}

sendBtn.addEventListener('click', async () => {
  const f = fileIn.files[0];
  if (!f || !label) return;
  if (!navigator.onLine) return fail('No hay conexión. Intenta de nuevo cuando tengas señal.');

  setSending(true);
  askMsg.className = ''; askMsg.textContent = '';
  try {
    const [img, location] = await Promise.all([toJpeg(f), userPos ? { ...userPos } : getGps()]);
    const body = {
      id: reportId,
      reservoirId: selected ? selected.id : null,
      label,
      location,
      capturedAt: new Date(f.lastModified).toISOString(),
      photos: [{ mediaType: 'image/jpeg', data: img.data }],
      meta: { name: f.name.slice(0, 120), originalSize: f.size, width: img.width, height: img.height },
    };
    const r = await fetch(`${API}/reports`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    document.getElementById('ask-done-text').textContent = location
      ? 'Un agrónomo la revisará.'
      : 'Un agrónomo la revisará. Se envió sin ubicación GPS.';
    showAsk(false);
  } catch (e) {
    setSending(false);
    fail('No se pudo enviar. Toca "Enviar foto" para intentar de nuevo.');
  }
});

// ---- HELPERS ----
function setInfo(html) { document.getElementById('info-bar').innerHTML = html; }
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---- SERVICE WORKER ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => {
    const label = document.getElementById('cache-label');
    const fill  = document.getElementById('cache-fill');
    const bar   = document.getElementById('cache-bar');
    const ready = () => { label.textContent = 'Mapa disponible sin conexión'; fill.style.width = '100%'; setTimeout(() => (bar.style.display = 'none'), 2500); };

    navigator.serviceWorker.addEventListener('message', e => {
      if (!e.data) return;
      if (e.data.type === 'CACHE_PROGRESS') {
        const pct = Math.round(e.data.pct);
        fill.style.width = pct + '%';
        label.textContent = `Descargando mapa sin conexión: ${pct}%`;
      }
      if (e.data.type === 'CACHE_READY') ready();
      if (e.data.type === 'CACHE_UNAVAILABLE') bar.style.display = 'none';
      if (e.data.type === 'CACHE_RETRY') label.textContent = 'El mapa sin conexión se descargará cuando haya señal';
    });

    // Ask the SW to download the offline map once it is active (no-op if already cached)
    navigator.serviceWorker.ready.then(r => r.active.postMessage({ type: 'CHECK_CACHE' }));
  }).catch(() => {
    document.getElementById('cache-bar').style.display = 'none';
  });
} else {
  document.getElementById('cache-bar').style.display = 'none';
}
</script>
</body>
</html>
