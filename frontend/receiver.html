<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gusanito – Receptor</title>
<style>
  @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-display: swap; src: url(vendor/fonts/atkinson-400.woff2) format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-display: swap; src: url(vendor/fonts/atkinson-700.woff2) format("woff2"); }
  :root { --ash: #e6e4dd; --paper: #f4f3ee; --coal: #1b1d19; --straw: #a89a6a; --rule: #c2bfb2; --reservoir: #17893f; --reservoir-ink: #0e5a29; --ember: #c93a14; --muted: #5b5d52; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Atkinson Hyperlegible", system-ui, sans-serif; background: var(--ash); color: var(--coal); line-height: 1.4; }
  :focus-visible { outline: 3px solid var(--coal); outline-offset: 2px; }
  header { background: var(--coal); color: var(--paper); padding: 12px 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; }
  header span { color: var(--straw); }
  header a { margin-left: auto; color: var(--paper); font-weight: 700; }
  main { padding: 16px; max-width: 980px; margin: 0 auto; }
  #empty { padding: 40px 0; color: var(--muted); }
  .report { display: grid; grid-template-columns: 112px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1.5px solid var(--rule); }
  .report img { width: 112px; height: 112px; object-fit: cover; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--paper); }
  .estado { display: inline-block; font-weight: 700; padding: 2px 10px; border-radius: 99px; border: 2px solid var(--coal); margin-bottom: 6px; }
  .estado.reservorio_confirmado { background: var(--reservoir); border-color: var(--reservoir-ink); color: #fff; }
  .estado.revision_humana, .estado.repetir_fotos { background: var(--straw); }
  .estado.pendiente { border-style: dashed; }
  .estado.error_analisis { border-color: var(--ember); color: var(--ember); }
  .demo-tag { display: inline-block; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--ember); color: #fff; margin-left: 6px; }
  .nota { margin: 4px 0 8px; max-width: 68ch; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: .92rem; }
  dt { color: var(--muted); }
  .bad { color: var(--ember); font-weight: 700; }
  a { color: var(--reservoir-ink); }
  nav { display: flex; gap: 4px; }
  nav a { margin: 0; color: var(--paper); text-decoration: none; padding: 4px 12px; border-radius: 99px; border: 1.5px solid transparent; }
  nav a[aria-current="page"] { border-color: var(--straw); }
  header #dl { margin-left: auto; }
  /* SMS: what the farmer's phone would show */
  .sms { display: grid; grid-template-columns: 220px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1.5px solid var(--rule); }
  .sms .to { font-weight: 700; font-variant-numeric: tabular-nums; }
  .sms .meta { font-size: .92rem; color: var(--muted); }
  .risk { display: inline-block; font-weight: 700; font-size: .85rem; padding: 1px 9px; border-radius: 99px; border: 2px solid var(--coal); margin: 4px 0; }
  .risk.high { background: var(--ember); border-color: var(--ember); color: #fff; }
  .risk.medium { background: var(--straw); border-color: var(--straw); }
  .bubble { align-self: start; justify-self: start; max-width: 46ch; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 16px 16px 16px 4px; padding: 10px 14px; overflow-wrap: anywhere; }
  .bubble small { display: block; margin-top: 6px; color: var(--muted); font-size: .8rem; }
  @media (max-width: 520px) { .report, .sms { grid-template-columns: 1fr; } .report img { width: 100%; height: 200px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Reportes recibidos</h1><span id="count"></span>
  <nav aria-label="Vista">
    <a href="#reportes" data-view="reportes">Reportes</a>
    <a href="#sms" data-view="sms">SMS enviados</a>
  </nav>
  <a id="dl" download="reportes.json" href="#">Descargar JSON</a>
</header>
<main id="list"><p id="empty">Cargando…</p></main>
<script src="config.js"></script>
<script>
const API = window.GUSANITO.apiBase;
// Open with just the link: the API serves the receiver's routes without a token (alert SMS show masked numbers).
try { localStorage.removeItem('rt'); } catch (_) {}  // token kept by earlier versions of this page

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ESTADO = {
  pendiente: 'Análisis pendiente', reservorio_confirmado: 'Reservorio confirmado', hospedero_sin_senales: 'Hospedero sin señales',
  descartado: 'Descartado', revision_humana: 'Revisión humana', repetir_fotos: 'Repetir fotos', error_analisis: 'Error de análisis',
};
const LABEL = { armyworm: 'Hay plaga', not_armyworm: 'No hay plaga', unsure: 'No está seguro' };
const HOSPEDERO = { si: ' (hospedero)', no: ' (no hospedero)', incierto: ' (hospedero incierto)' };
const place = p => p ? `<a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lng}#map=16/${p.lat}/${p.lng}">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</a>${p.accuracy ? ` (±${Math.round(p.accuracy)} m)` : ''}` : '—';

function row(x) {
  const a = x.analisis;
  const rows = [];
  // Claude's answer first: yes/no and how sure it is of that answer (reports analysed before
  // hay_plaga existed have no answer to show).
  if (a && typeof a.hay_plaga === 'boolean') rows.push(
    ['¿Hay plaga? (Claude)', `<strong>${a.hay_plaga ? 'Sí' : 'No'}</strong>`],
    ['Seguridad de Claude', Math.round(a.confianza * 100) + '%']);
  rows.push(
    ['Dijo el extensionista', x.label ? esc(LABEL[x.label]) : '—'],
    ['Concuerda con Claude', x.agrees === null ? '—' : x.agrees ? 'Sí' : '<span class="bad">No</span>'],
    ['Parche', x.reservoirId ? esc(x.reservoirId) : '—'],
    ['Ubicación GPS', place(x.location)]);
  if (a) rows.push(
    ['Fotos', esc(a.calidad_fotos)], ['Vegetación', `${esc(a.tipo_vegetacion)}${HOSPEDERO[a.es_hospedero] || ''}`],
    ['Señales', a.senales_gusano.length ? esc(a.senales_gusano.join(', ')) : 'ninguna'],
    ['Severidad', esc(a.severidad)]);
  else if (x.refused) rows.push(['Análisis', 'Claude no analizó la foto']);
  else if (x.analysisError) rows.push(['Análisis', `falló (${esc(x.analysisError)})`]);
  return `<article class="report">
    <img alt="Foto del reporte" loading="lazy" src="${API}/reports/${encodeURIComponent(x.id)}/photos/0">
    <div>
      <span class="estado ${esc(x.estado)}">${esc(ESTADO[x.estado] || x.estado)}</span>${x.demo ? '<span class="demo-tag" title="Enviado en modo demo, con ubicación fija">Demo</span>' : ''}
      <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      <p class="nota" style="color:var(--muted);font-size:.85rem">${esc(new Date(x.receivedAt).toLocaleString())}</p>
    </div></article>`;
}

// ---- SMS enviados: the alert SMS each farmer would get (nothing is really sent) ----
const LANGUAGE = { es: 'español', en: 'inglés', ny: 'nyanja' };
const RISK = { high: 'Riesgo alto', medium: 'Riesgo medio', low: 'Vigilancia' };
const DIRECTION = { north: 'norte', northeast: 'noreste', east: 'este', southeast: 'sureste', south: 'sur',
  southwest: 'suroeste', west: 'oeste', northwest: 'noroeste' };
// The SMS ends with the offline map link: make it clickable, it opens the PWA with those points.
const linkify = text => esc(text).replace(/https?:\/\/\S+/g, u => `<a target="_blank" rel="noopener" href="${u}">${u}</a>`);

function smsRow(m) {
  return `<article class="sms">
    <div>
      <div class="to">${esc(m.phone)}</div>
      <span class="risk ${esc(m.riskLevel)}">${esc(RISK[m.riskLevel] || m.riskLevel)}</span>
      <div class="meta">Reservorio ${esc(m.reservoirId)}, a ${Number(m.distanceKm).toFixed(1)} km al ${esc(DIRECTION[m.direction] || m.direction)}</div>
      <div class="meta">En ${esc(LANGUAGE[m.language] || m.language)}</div>
    </div>
    <p class="bubble">${linkify(m.sms)}<small>${esc(new Date(m.sentAt).toLocaleString())} · ${m.sms.length} caracteres</small></p>
  </article>`;
}

const VIEWS = {
  reportes: { path: 'reports', title: 'Reportes recibidos', file: 'reportes.json', render: row,
    empty: 'Todavía no hay reportes. Envía una foto desde la app.' },
  sms: { path: 'outbox', title: 'SMS enviados', file: 'sms.json', render: smsRow,
    empty: 'Todavía no hay SMS. Se generan cuando una foto confirma un reservorio cerca de agricultores registrados.' },
};
const view = () => VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'reportes';

async function load() {
  const name = view(), v = VIEWS[name];
  document.title = `Gusanito – ${v.title}`;
  document.getElementById('title').textContent = v.title;
  document.querySelectorAll('nav a').forEach(a =>
    a.dataset.view === name ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const r = await fetch(`${API}/${v.path}`);
  if (name !== view()) return;  // switched tabs while loading
  const list = document.getElementById('list');
  if (!r.ok) { list.innerHTML = '<p id="empty">No se pudo cargar. Se reintenta en unos segundos.</p>'; return; }
  const rows = await r.json();
  document.getElementById('count').textContent = `${rows.length} en total`;
  const dl = document.getElementById('dl');
  dl.download = v.file;
  dl.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(rows, null, 2));
  list.innerHTML = rows.length ? rows.map(v.render).join('') : `<p id="empty">${v.empty}</p>`;
}
window.addEventListener('hashchange', load);

load();
setInterval(load, 15000);
</script>
</body>
</html>
